[project]
name = "enterprise-graph-rag"
version = "0.1.0"
description = "Local, open-source Graph RAG POC for chip supply-chain risk & impact analysis (Neo4j + Ollama)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "neo4j>=5.24",
    "ollama>=0.3.3",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "pyvis>=0.3.2",
    "pypdf>=4.2",
    "llama-index-core>=0.11",
    "llama-index-llms-ollama>=0.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
